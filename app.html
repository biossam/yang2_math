const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function term(co,v,first){if(co===0)return '';const a=Math.abs(co);const s=co<0?(first?'−':' − '):(first?'':' + ');return s+(v?(a===1?'':a)+v:a)}
function poly(cs,v='x'){let s='';const d=cs.length-1;cs.forEach((co,i)=>{const p=d-i;const vv=p===0?'':p===1?v:v+'^'+p;s+=term(co,vv,!s)});return s||'0'}
function lin(a,b,c){let s=term(a,'x',true);s+=term(b,'y',!s);s+=term(c,'',!s);return s+' = 0'}

    if(pre==='}}'){const st=s.lastIndexOf('{{',off);const num=s.slice(st+2,s.indexOf('§',st));d=num.slice(-1)}
    if(pre==='°'||pre==='%')d='2';
    if(!/\d/.test(d))return m;const con=CON.includes(d);

const valOf=s=>{s=String(s).replace(/,/g,'').replace(/\s*(cm²|cm³|cm|mm|km|m²|m|°|개|명|원|번|자루|장|살|일|분|초|시간|kg|g|mL|L|%|배|상자|권|컵|봉지)$/,'').trim();let m=s.match(/^(\d+)?\{\{(\d+)§(\d+)\}\}$/);if(m)return (+(m[1]||0)*+m[3]+ +m[2])/+m[3];if(/^\d+(\.\d+)?$/.test(s))return +s;return null};

const frBal=p=>{const m=String(p.x[0]).match(/^(\d+)?\{\{(\d+)§(\d+)\}\}$/);if(!m)return;const q=+m[3],mixed=!!m[1];const V=p.x.map(valOf);if(V.some(v=>v==null))return;const a=V[0];
  const fm=N=>{if(N<=0||!Number.isInteger(N))return null;if(mixed){const w=Math.floor(N/q),r=N%q;return w&&r?`${w}{{${r}§${q}}}`:null}return `{{${N}§${q}}}`};
  let D=p.x.slice(1).map((x,i)=>({x,v:V[i+1]}));const r=ri(0,Math.min(3,D.length));let guard=0;
  while(guard++<6){const lo=D.filter(d=>d.v<a).length;if(lo===r)break;const all=[a,...D.map(d=>d.v)];
    if(lo>r){const i=D.findIndex(d=>d.v<a);let k=1,nx=null;while(k<8&&!nx){const N=Math.round(a*q)+k;const t=fm(N);if(t&&!D.some(d=>Math.abs(d.v-N/q)<1e-9))nx={x:t,v:N/q};k++}if(!nx)break;D.splice(i,1,nx)}
    else{const i=D.findIndex(d=>d.v>a);let k=1,nx=null;while(k<8&&!nx){const N=Math.round(a*q)-k;const t=fm(N);if(t&&!D.some(d=>Math.abs(d.v-N/q)<1e-9))nx={x:t,v:N/q};k++}if(!nx)break;D.splice(i,1,nx)}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickOne(cid,lv,used){
  const all=shuffle(pool(cid)).filter(p=>!used.has(p.id));
  const t=today();
  const fresh=p=>lastSeen(p.id)<t;
  let c=all.filter(p=>p.l===lv&&fresh(p)).sort((a,b)=>lastSeen(a.id)-lastSeen(b.id));
  if(!c.length&&lv<=2&&C[cid].gen&&Math.random()<.85){const g=genOne(cid);if(g)return g}
  if(!c.length){for(const d of [1,-1,2,-2]){c=all.filter(p=>p.l===lv+d&&fresh(p));if(c.length)break}}
  if(!c.length&&C[cid].gen)return genOne(cid);
  if(!c.length)c=all.filter(p=>p.l===lv).concat(all);
  // 같은 레벨에서 유형 섞기: 이미 고른 유형과 다른 것 우선
  const ut=new Set([...used].map(id=>id.split('|')[1]).filter(Boolean));
  const d=c.find(p=>!ut.has(p.t))||c[0];
  return d||null;
}

function pickSet(specs){ // specs: [{cid,lv}]
  const used=new Set(),out=[];
  for(const s of specs){const p=pickOne(s.cid,s.lv,used);if(p){used.add(p.id);used.add(p.id+'|'+p.t);out.push(prepare(p))}}
  return out;
}

function catOrd(){const d=today();if(CAT_ORDER._d!==d||CAT_ORDER._sp!==S.sp){const sx=(S.seedX=S.seedX||Math.floor(Math.random()*1e6));const a=CAT_SLOTS.slice();let t=(d*2654435761+sx*40503)>>>0;const rnd=()=>{t=(t+0x6D2B79F5)>>>0;let x=Math.imul(t^(t>>>15),1|t);x=(x+Math.imul(x^(x>>>7),61|x))^x;return ((x^(x>>>14))>>>0)/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}const ci=a.indexOf('card');if(ci>=0){a.splice(ci,1);a.push('card')}if(S.sp==='dog'){const lo=a.filter(x=>!CAT_HIGH.has(x)),hi=a.filter(x=>CAT_HIGH.has(x));a.length=0;a.push(...lo,...hi)}a._d=d;a._sp=S.sp;CAT_ORDER=a}return CAT_ORDER}

  let good=0,fast=0,fixOk=0,self=0;const wrong=[];
  ps.list.forEach((p,i)=>{const r=!!ps.res[i],f=!!(ps.fast&&ps.fast[i]);if(p.t==='self'){self++;return}if(f)fast++;if(r&&!f){good++;if(p.retry||RUN.mode==='fix')fixOk++}else if(p.t!=='self')wrong.push({id:p.mid||p.id,cid:p.cid,l:p.l,t:p.t})});

// RUN = {mode, title, steps:[...], i, start}
function startSession(cidSel){
  const ch=(typeof cidSel==='string'&&C[cidSel])?{cid:cidSel,isNew:!(S.c[cidSel]&&S.c[cidSel].seen)}:chooseBlank();const steps=[];
  const fc=flashCards(ch.cid);if(fc.length)steps.push({k:'flash',cards:fc,j:0,show:false,res:[]});
  if(ch.isNew)steps.push({k:'learn',cid:ch.cid});
  steps.push({k:'blank',cids:[ch.cid],phase:'write',checked:{},t0:null});
  steps.push({k:'probs',list:null,j:0,ans:null,res:[],auto:true});
  steps.push({k:'done'});
  RUN={mode:'session',title:'오늘의 15분',steps,i:0,start:Date.now(),blankCid:ch.cid,re:()=>startSession(ch.cid)};
  go('run');startTick();
}
function startBlank(cids,title){RUN={mode:'blank',title,steps:[{k:'blank',cids,phase:'write',checked:{},t0:null},{k:'done'}],i:0,start:Date.now(),re:()=>startBlank(cids,title)};go('run');startTick()}
function startProbs(list,title,mode='practice'){if(!list.length){toast('풀 문제가 없어요');return}const copy=list.map(p=>Object.assign({},p));RUN={mode,title,steps:[{k:'probs',list,j:0,ans:null,res:[]},{k:'done'}],i:0,start:Date.now(),re:()=>startProbs(copy.map(p=>prepare(Object.assign({},p))),title,mode)};go('run');startTick()}
function practiceList(cids,n){const specs=[];for(let i=0;i<n;i++){const cid=cids[i%cids.length];const lv=PRACT.lv||lvFor(mastery(cid));specs.push({cid,lv})}return pickSet(shuffle(specs))}
function startTick(){clearInterval(TICK);TICK=setInterval(()=>{const el=document.getElementById('clock');if(!el||!RUN){return}el.textContent=clockText();const bt=document.getElementById('btimer');if(bt){const st=RUN.steps[RUN.i];if(st&&st.t0){const left=Math.max(0,240-Math.floor((Date.now()-st.t0)/1000));bt.textContent=mmss(left);bt.classList.toggle('over',left===0)}}},1000)}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function clockText(){const e=Math.floor((Date.now()-RUN.start)/1000);const el=document.getElementById('clock');if(el&&RUN.target)el.classList.toggle('over',e>RUN.target);return RUN.mode==='session'?`⏱ ${mmss(e)} / 15:00`:RUN.target?`⏱ ${mmss(e)} / ${mmss(RUN.target)}`:`⏱ ${mmss(e)}`}
function startExam(){
  // 내신 실전: 객관식·단답 19 + 서술형 3 = 22문항, 중상(실력)·상(심화) 50% 이상, 학평 유형 우선, 목표 50분
  const ids=rangeIds();const all=ids.flatMap(id=>pool(id));
  const pick=(arr,n,used)=>{const by={};shuffle(arr).sort((x,y)=>(y.h||0)-(x.h||0)).forEach(p=>{if(!used.has(p.id))(by[p.cid]=by[p.cid]||[]).push(p)});
    const order=shuffle(Object.keys(by));const out=[];let r=0;while(out.length<n&&order.some(c=>by[c].length>r)){for(const c of order){if(out.length>=n)break;if(by[c][r]){out.push(by[c][r]);used.add(by[c][r].id)}}r++}return out};
  const used=new Set();
  const objHi=pick(all.filter(p=>p.l>=2&&(p.t==='mc'||p.t==='sa')),12,used);
  const objLo=pick(all.filter(p=>p.l===1&&(p.t==='mc'||p.t==='sa')),19-objHi.length,used);
  const desc=pick(all.filter(p=>p.t==='self'&&p.l>=2),3,used);
  const obj=shuffle(objHi.concat(objLo)).sort((x,y)=>x.l-y.l);
  const list=obj.concat(desc);
  if(list.length<8){toast('이 범위에는 실전 문항이 부족해요');return}
  startProbs(list.map(prepare),'실전 '+list.length+'문항','exam');RUN.target=50*60;RUN.steps[0].levelNote='객관식 '+obj.length+' · 서술형 '+desc.length+' · 목표 50분';
}

// 플래시 복습: 먼저 답하고 확인 (숫자는 숫자 칸 + 단위 고르기, 1~2학년은 고르기)
const FU_FAM=[['mm','cm','m','km'],['cm²','m²','km²','cm'],['cm³','m³','mL','L'],['g','kg','t'],['mL','L'],['초','분','시간','일'],['°','cm','개','분'],['개','명','마리','장'],['원','개','명','장'],['살','개','명','년'],['%','개','cm','°'],['만','억','조','천'],['쌍','개','명','장'],['단','개','씩','배'],['씩','개','배','단']];
const FU_ALL=[...new Set(FU_FAM.flat())].sort((a,b)=>b.length-a.length);
function flParse(a){let x=String(a).replace(/\s*\([^)]*\)\s*$/,'').trim();
  let m=x.match(/^(\d+)?\{\{(\d+)§(\d+)\}\}$/);if(m)return {k:'frac',w:+(m[1]||0),n:+m[2],d:+m[3],v:(+(m[1]||0)*+m[3]+ +m[2])/+m[3]};
  m=x.match(/^(\d[\d,]*(?:\.\d+)?)\s*(.*)$/);if(m){const u=m[2].trim();const n=+m[1].replace(/,/g,'');if(!u)return {k:'num',n,u:''};if(FU_ALL.includes(u))return {k:'num',n,u}}
  return {k:'text',core:x}}
function flUnits(u){const fam=FU_FAM.find(f=>f.includes(u))||[];const o=[u];for(const v of fam.concat(['개','cm','분','°','원','명']))if(!o.includes(v)&&o.length<4)o.push(v);return shuffle(o)}
function flNorm(t){return String(t).replace(/[x*]/gi,'×').replace(/\([^)]*\)/g,'').replace(/\.\.\./g,'…').replace(/[\s.,~·!?'"]/g,'').toLowerCase()}
function flFrac(t){t=String(t).trim();let m=t.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m)return {w:+m[1],n:+m[2],d:+m[3],v:+m[1]+ +m[2]/+m[3]};m=t.match(/^(\d+)\s*\/\s*(\d+)$/);if(m)return {w:0,n:+m[1],d:+m[2],v:+m[1]/+m[2]};m=t.match(/^\d+(\.\d+)?$/);if(m)return {w:0,n:0,d:1,v:+t,plain:true};return null}
function flMode(c){const P=flParse(c.a);const g=+C[c.cid].u[0];if(g<=2)return 'mc';return P.k}
function flOpts(st){st.fopt=st.fopt||{};if(st.fopt[st.j])return st.fopt[st.j];const c=st.cards[st.j],P=flParse(c.a);let o;
  if(P.k==='num'){o=[c.a,...balDs(P.n,[],P.n>=200&&Number.isInteger(P.n)?10**(Math.floor(Math.log10(P.n))-1):1).map(v=>(P.u?`${cm(v)}${/^[a-zA-Z°%²³]/.test(P.u)&&P.u!=='%'&&P.u!=='°'?' ':''}${P.u}`:cm(v)))]}
  else{const g=C[c.cid].u[0];const pool=[...new Set(Object.values(C).filter(k=>k.u[0]===g).flatMap(k=>k.fl.map(f=>f[1])).filter(a=>a!==c.a&&flParse(a).k===P.k&&flNorm(a)!==flNorm(c.a)))];o=[c.a,...shuffle(pool).slice(0,3)]}
  return st.fopt[st.j]=shuffle(o.slice(0,4))}
function flashHTML(st){const c=st.cards[st.j];const P=flParse(c.a),mode=flMode(c);
  let inp='';if(!st.show){
    if(mode==='mc')inp=`<div class="opts">${flOpts(st).map((o,i)=>`<button class="opt" data-fpick="${i}"><span class="on">${"①②③④"[i]}</span><span>${fmt(o)}</span></button>`).join('')}</div>`;
    else if(mode==='num')inp=`<div class="fin"><input id="fnum" inputmode="decimal" autocomplete="off" placeholder="숫자" value="${esc(st.fnum||'')}">${P.u?`<div class="uchips">${(st.fu=st.fu||{},st.fu[st.j]=st.fu[st.j]||flUnits(P.u)).map(u=>`<button class="uchip ${st.funit===u?'on':''}" data-funit="${esc(u)}">${esc(u)}</button>`).join('')}</div>`:''}</div><button class="btn wide" data-act="fcheck">확인하기</button>`;

function rmMig(R){if(!R.rooms){R.rooms=[{id:1,t:'room',name:'내 방',wall:R.wall||'cream',floor:R.floor||'wood',items:R.items||[]}];R.cur=1;R.rid=2;R.home=R.home||{};delete R.wall;delete R.floor;delete R.items}
  if(!R.home)R.home={};const d=Object.getOwnPropertyDescriptor(R,'items');if(!d||!d.get)['wall','floor','items'].forEach(k=>{delete R[k];Object.defineProperty(R,k,{get(){return rmCur(R)[k]},set(v){rmCur(R)[k]=v},enumerable:false,configurable:true})});return R}

function rmMkRoom(t){const R=rmS();const T=RM_RT[t];const same=R.rooms.filter(r=>r.t===t).length;const r={id:R.rid++,t,name:T.n+(same?' '+(same+1):''),wall:T.wall,floor:T.floor,items:[]};
  T.it.forEach(([k,x,y])=>{r.items.push({id:R.nid++,k,x,y,f:0});if(!R.own.includes(k))R.own.push(k)});[T.wall,T.floor].forEach(k=>{if(!R.own.includes(k))R.own.push(k)});R.rooms.push(r);R.cur=r.id;save();return r}

function rmMove(el,x,y,z,pose,walk=true){const x0=parseFloat(el.style.left);el.classList.toggle('rmflip',x<x0);if(walk){rmSetPose(el,'sit');el.classList.add('rmwalk')}

function rmWander(){clearInterval(RM_T);const used={};
  RM_T=setInterval(()=>{if(VIEW!=='room'||RM_TAB!=='room'){clearInterval(RM_T);return}if(RM_SEEK||RM_EDIT)return;try{jsWalk()}catch(e){}
    const spots=rmAllSpots();
    document.querySelectorAll('#rmscene .rmc').forEach(el=>{if(el.classList.contains('rmwalk'))return;if(Math.random()<(el._pose==='sleep'?.8:.5))return;
      if(el._spot){delete used[el._spot];el._spot=null}
      const r=Math.random();const dog=rmIsDog(el);const free=spots.filter(s=>!used[s.key]&&!(dog&&rmHighSpot(s)));
      if(r<.4&&free.length){const s=free[Math.floor(Math.random()*free.length)];const p=rmSpotPos(s.it,s.sp);used[s.key]=1;el._spot=s.key;rmMove(el,p.x,p.y,p.z,s.sp[2])}
      else if(r<.55){rmSetPose(el,'sleep')}else if(r<.65){rmSetPose(el,'stretch');setTimeout(()=>rmSetPose(el,'sit'),1800)}else if(r<.72){rmSetPose(el,'lie')}

function rmSeek(){const sc=document.getElementById('rmscene');if(!sc)return;const cats=[...sc.querySelectorAll('.rmc')];if(!cats.length)return;

      const peekY=it.k==='box'?it.y-I.w*ar*.18:it.k==='window'?it.y-I.w*ar*.02:it.y-I.w*ar*.12;hides.push({x:it.x+(Math.random()-.5)*I.w*.4,y:peekY,z:(I.p==='wall'?1:Math.round(it.y)-1),k:it.k})}});
  const edges=[{x:3,y:82,z:3},{x:97,y:90,z:3},{x:50,y:108,z:3},{x:3,y:99,z:3},{x:97,y:72,z:3}];

    cover.innerHTML=`<b>🔍 숨은 친구 ${cats.length}마리를 찾아 보세요!</b><span>${esc?'🐾 발자국을 따라가 봐요 — 방을 탈출한 친구가 있어요!':'가구 뒤, 상자 안, 방 구석을 살펴봐요'}</span>`;rmSeekBadge();setTimeout(()=>cover.classList.add('rmfade'),1600);setTimeout(()=>cover.remove(),2300)},1500)}

function camDragInit(){const st=document.querySelector('#rmcam .camview');if(!st)return;
  st.querySelectorAll('.camcat').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();const n=+el.dataset.camcat;const c=CAM.cats[n];const r=st.getBoundingClientRect();const x0=e.clientX,y0=e.clientY,cx=c.x,cy=c.y;let moved=false;
    const chg=CAM.sel!==n;if(chg){CAM.sel=n;st.querySelectorAll('.camcat').forEach(z=>z.classList.toggle('sel',+z.dataset.camcat===n))}
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    const mv=ev=>{const dx=(ev.clientX-x0)/r.width*100,dy=(ev.clientY-y0)/r.height*100;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;c.x=Math.max(0,Math.min(100,cx+dx));c.y=Math.max(15,Math.min(115,cy+dy));el.style.left=c.x+'%';el.style.top=c.y+'%'};

    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}))}

function camLoadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
async function camShoot(){const cd=document.getElementById('camcd');for(const n of [3,2,1]){if(!CAM)return;if(cd){cd.textContent=n;cd.className='camcd go'}await new Promise(r=>setTimeout(r,800));if(cd)cd.className='camcd'}
  if(!CAM)return;const W=900,H=1200,FT=150,P=36;const cv=document.createElement('canvas');cv.width=W+P*2;cv.height=H+P+FT;const x=cv.getContext('2d');const fr=CAM_FRAMES[CAM.frame];
  x.fillStyle=fr[0];x.fillRect(0,0,cv.width,cv.height);x.save();x.beginPath();x.roundRect?x.roundRect(P,P,W,H,28):x.rect(P,P,W,H);x.clip();
  const cover=(w,h)=>{const s=Math.max(W/w,H/h);return [P+(W-w*s)/2,P+(H-h*s)/2,w*s,h*s]};
  const v=document.getElementById('camv');

  else if(CAM.bgc){x.fillStyle=CAM.bgc.match(/#[0-9A-Fa-f]{6}/)[0];x.fillRect(P,P,W,H)}
  else if(v&&v.videoWidth){const [a,b,c,d]=cover(v.videoWidth,v.videoHeight);if(CAM.facing==='user'){x.translate(2*P+W,0);x.scale(-1,1)}x.drawImage(v,a,b,c,d);x.setTransform(1,0,0,1,0,0)}
  else{x.fillStyle='#FFF6E6';x.fillRect(P,P,W,H)}
  for(const c of CAM.cats){const im=await camLoadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(c.i<0?camJs(c.f):camSvg(BREEDS[c.i],c.pose,c.f)));const w=W*c.s/100,h=w*(c.i<0?84/60:c.pose==='wave'?54/48:54/44);x.drawImage(im,P+W*c.x/100-w/2,P+H*c.y/100-h,w,h)}
  x.restore();x.fillStyle=fr[1];x.textBaseline='middle';x.font="44px Jua, 'IBM Plex Sans KR', sans-serif";const R=rmS();
  x.fillText('🐾 '+(R.name||'나')+' & '+(CAM.cats.filter(c=>c.i>=0).map(c=>BREEDS[c.i].n).join(', ')||'친구'),P+6,H+P+FT*.42,W-12);x.font="26px 'IBM Plex Sans KR', sans-serif";x.globalAlpha=.75;x.fillText(new Date().toLocaleDateString('ko-KR')+' · yang2수학 미니홈피',P+6,H+P+FT*.78);x.globalAlpha=1;
  CAM.shot=cv.toDataURL('image/png');camStop();R.love=R.love||{};CAM.cats.forEach(c=>{if(c.i>=0)R.love[c.i]=(R.love[c.i]||0)+1});save();camDraw()}
function camFileName(){const d=new Date();return `yang2셀카_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.png`}

async function ptStart(kind){const R=rmS();PT.nick=(PT.nick||'').trim();if(!PT.nick){toast('친구들이 알아볼 수 있게 별명을 써 주세요');const n=document.querySelector('#rmparty [data-ptnick]');if(n)n.focus();return}R.ptNick=PT.nick;save();

function ptConnect(){PT.since=0;PT.gotHello=false;let es;try{es=new EventSource(`${PT_URL}/api/events?code=${PT.code}&pid=${PT.pid}&tok=${encodeURIComponent(PT.tok)}`)}catch(e){return ptPollStart()}PT.es=es;

  es.onerror=()=>{if(!PT)return;if(!PT.gotHello){return ptPollStart()}if(es.readyState===2){ptStop();ptMsg('👋 놀이가 끝났어요','방이 닫혔거나 연결이 끊겼어요.','<button class="cambig" data-pt="menu">처음으로</button>')}else{const b=document.getElementById('ptnet');if(b)b.style.display=''}};
  es.onopen=()=>{const b=document.getElementById('ptnet');if(b)b.style.display='none'}}
function ptPollStart(){if(!PT||PT.polling)return;clearTimeout(PT.ht);if(PT.es&&PT.es.close&&!PT.es.poll)PT.es.close();PT.polling=true;PT.es={poll:1,readyState:1,close(){if(PT)PT.polling=false}};PT.since=0;ptPollLoop()}
async function ptPollLoop(){let fails=0;while(PT&&PT.polling){try{const j=await ptApi('/api/poll',{code:PT.code,pid:PT.pid,tok:PT.tok,since:PT.since||0});if(!PT||!PT.polling)return;fails=0;const b=document.getElementById('ptnet');if(b)b.style.display='none';
    if(j.hello){PT.gotHello=true;ptOn(j.hello)}(j.evs||[]).forEach(d=>{if(PT)ptOn(d)});if(PT)PT.since=j.seq}
  catch(e){if(!PT||!PT.polling)return;if(e.code==='gone'||e.code==='auth'){ptStop();ptMsg('👋 놀이가 끝났어요','방이 닫혔거나 연결이 끊겼어요.','<button class="cambig" data-pt="menu">처음으로</button>');return}fails++;const b=document.getElementById('ptnet');if(b)b.style.display=''}
  await new Promise(r=>setTimeout(r,fails?2500:1200))}}
function ptKeys(){const o=[];if(!PT)return o;(PT.people||[]).forEach(p=>(p.cats||[]).forEach(c=>{if(BREEDS[c.i])o.push({k:p.pid+'-'+c.i,i:c.i,own:p.nick,pid:p.pid,host:p.host})}));return o}
function ptOn(d){if(d.t==='hello'){PT.snap=d.snap;PT.people=d.people;(d.pos||[]).forEach(p=>PT.st[p.k]=p);ptPlay();ptReward();if(d.seek)ptSeekStart(d.seek.hides,d.seek.found,null,true);return}
  if(d.t==='people'){const before=ptKeys().map(c=>c.k).join();PT.people=d.people;if(d.join){ptBubble(null,`🐾 ${esc(d.join)} 친구가 놀러 왔어요!`);if(PT.host){const R=rmS();R.guests=(R.guests||[]).concat({n:d.join,d:new Date().toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}).slice(-30);save()}}
    if(d.left)ptBubble(null,`👋 ${esc(d.left)} 친구가 돌아갔어요`);const jb=[...document.querySelectorAll('#ptscene .ptjs')].map(x=>x.dataset.ptj).join();if(ptKeys().map(c=>c.k).join()!==before||jb!==(PT.people||[]).map(p=>p.pid).join())ptPlay();else{ptPeople();(PT.people||[]).forEach(p=>{const j=document.querySelector(`#ptscene [data-ptj="${p.pid}"]`);if(j)j.classList.toggle('off',!p.on)})}ptReward();return}

function ptPlay(){if(!PT||!PT.snap)return;const el=ptEl();const s=PT.snap;const W=RM_WALL[s.wall]||RM_WALL.cream,F=RM_FLOOR[s.floor]||RM_FLOOR.wood;const host=(PT.people||[]).find(p=>p.host);

    <div class="ptpeople" id="ptpeople"></div>

function ptQR(url){const draw=()=>{const box=document.getElementById('ptqrimg');if(!box)return;try{box.innerHTML=qrSVG(url,180)}catch(e){box.textContent='QR을 만들 수 없어요. 코드를 알려 주세요.'}};
  draw()}
function ptHostTick(initial){if(!PT||!PT.host||!PT.snap)return;if(PT.busy>Date.now()||PT.seek)return;const keys=ptKeys();if(!keys.length)return;
  const spots=[];(PT.snap.items||[]).forEach(it=>{if(RM_ITEMS[it.k])(RM_SPOTS[it.k]||[]).forEach((sp,j)=>spots.push({key:it.id+':'+j,it,sp}))});
  const used={};keys.forEach(c=>{const s=PT.st[c.k];if(s&&s.spot)used[s.spot]=1});const out=[];
  keys.forEach(c=>{let s=PT.st[c.k]||{k:c.k,x:50,y:80,z:81,pose:'sit'};let w=0;
    if(!initial&&Math.random()>(s.pose==='sleep'?.2:.5)){if(s.spot){delete used[s.spot];s.spot=null}const r=Math.random();const free=spots.filter(q=>!used[q.key]);
      if(r<.4&&free.length){const q=free[Math.floor(Math.random()*free.length)];const p=rmSpotPos(q.it,q.sp);used[q.key]=1;s={k:c.k,x:p.x,y:p.y,z:p.z,pose:q.sp[2],spot:q.key};w=1}
      else if(r<.55)s=Object.assign({},s,{pose:'sleep'});else if(r<.65)s=Object.assign({},s,{pose:'stretch'});else if(r<.72)s=Object.assign({},s,{pose:'lie'});else if(r<.8)s=Object.assign({},s,{pose:'wave'});
      else{const y=64+Math.random()*31;s={k:c.k,x:6+Math.random()*86,y,z:Math.round(y)+1,pose:'sit'};w=1}}

function ptGather(x,y){const keys=ptKeys();return keys.map((c,i)=>{const dx=(i%5-2)*5,dy=(Math.floor(i/5)-1)*4;const cx=Math.max(5,Math.min(95,x+dx)),cy=Math.max(64,Math.min(98,y+6+dy));return [c.k,cx,cy]})}
function ptRun(list,dur){if(PT&&PT.seek)return;list.forEach(([k,cx,cy])=>{const el=document.querySelector(`#ptscene [data-ptc="${k}"]`);if(!el)return;el.classList.toggle('rmflip',cx<parseFloat(el.style.left));ptPose(el,'sit');el.classList.add('rmwalk');el.style.transition=`left ${dur}s ease-out,top ${dur}s ease-out`;el.style.left=cx+'%';el.style.top=cy+'%';el.style.zIndex=Math.round(cy)+1})}

function ptSnack(e,x,y,by){const sc=document.getElementById('ptscene');if(!sc)return;PT.busy=Date.now()+5000;ptBubble(by,`${e} 간식을 줬어요!`);const bowl=document.createElement('div');bowl.className='rmbowl';bowl.textContent=e;bowl.style.left=x+'%';bowl.style.top=y+'%';sc.appendChild(bowl);
  const list=ptGather(x,y-4);ptRun(list,1.6);setTimeout(()=>ptRest(list),1900);setTimeout(()=>bowl.remove(),4200)}
function ptCatCard(k){const c=ptKeys().find(x=>x.k===k);if(!c)return;const b=BREEDS[c.i];ask(catBig(b),esc(b.n),`<b>${esc(c.own)}</b>의 ${spName(b)}예요<br><span class="small">${esc(b.t)}</span>`+catCredit(b),[{t:'💗 쓰다듬기',cls:'go',fn:()=>{if(PT)ptApi('/api/act',{code:PT.code,pid:PT.pid,tok:PT.tok,t:'pet',k}).catch(()=>{})}}],'닫기')}
document.addEventListener('click',e=>{const t=e.target.closest('#rmparty [data-pt],#rmparty [data-ptbring],#rmparty [data-pttoy],#rmparty [data-ptsnack],#rmparty [data-ptsay],#rmparty [data-ptc],[data-rmparty]');if(!t)return;e.preventDefault();e.stopPropagation();
  if(t.dataset.rmparty!=null)return ptOpen();
  if(PT&&PT.seek&&t.dataset.ptc)return;
  if(!PT)return;const a=t.dataset.pt;const act=(o)=>ptApi('/api/act',Object.assign({code:PT.code,pid:PT.pid,tok:PT.tok},o)).catch(err=>{if(err.code==='slow')toast('조금 천천히 눌러 주세요');else if(err.code==='seeking')toast('벌써 숨바꼭질 중이에요!')});
  if(a==='close')return ptClose();
  if(a==='menu'){ptStop();PT={scr:'menu',code:'',nick:PT.nick,bring:[]};return ptDraw()}
  if(a==='tojoin'){PT.scr='join';return ptDraw()}
  if(a==='host')return ptStart('host');
  if(a==='join')return ptStart('join');
  if(a==='seek'){if(PT.seek)return;const h=ptMakeHides();if(!h.length){toast('숨을 친구가 없어요');return}act({t:'seek',hides:h});return}
  if(a==='qr'){PT.qr=!PT.qr;return ptPlay()}
  if(t.dataset.ptbring){const i=+t.dataset.ptbring;const k=PT.bring.indexOf(i);if(k>=0)PT.bring.splice(k,1);else{if(PT.bring.length>=3){toast('최대 3마리까지 데려갈 수 있어요');return}PT.bring.push(i)}t.classList.toggle('on',PT.bring.includes(i));return}
  if(t.dataset.pttoy){const path=[];for(let n=0;n<5;n++)path.push([+(10+Math.random()*80).toFixed(1),+(66+Math.random()*28).toFixed(1)]);return act({t:'toy',e:t.dataset.pttoy,path})}
  if(t.dataset.ptsnack)return act({t:'snack',e:t.dataset.ptsnack,x:+(15+Math.random()*70).toFixed(1),y:+(80+Math.random()*14).toFixed(1)});
  if(t.dataset.ptsay)return act({t:'say',m:+t.dataset.ptsay});
  if(t.dataset.ptc)return ptCatCard(t.dataset.ptc);
},true);
document.addEventListener('input',e=>{if(!PT)return;const t=e.target;if(t.matches('#rmparty [data-ptnick]'))PT.nick=t.value.slice(0,8);else if(t.matches('#rmparty [data-ptcode]')){t.value=t.value.replace(/\D/g,'').slice(0,4);PT.code=t.value}});
(()=>{try{const q=new URLSearchParams(location.search);const c=(q.get('party')||'').replace(/\D/g,'').slice(0,4);if(!c)return;q.delete('party');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);
  setTimeout(()=>{try{closeModal()}catch(e){}ptOpen(c)},700)}catch(e){}})();

// ----- 다 같이 숨바꼭질 -----
function ptMakeHides(){const sc=document.getElementById('ptscene');if(!sc||!PT||!PT.snap)return [];const ar=sc.clientWidth/sc.clientHeight||4/3;const spots=[];
  (PT.snap.items||[]).forEach(it=>{const I=RM_ITEMS[it.k];if(!I||I.p==='wall')return;if(['box','plant','sofa','shelf','lamp','tower','bed','fish','desk','bathtub','washer','basket','cushion'].includes(it.k)){
    const peekY=it.k==='box'||it.k==='basket'?it.y-I.w*ar*.18:it.y-I.w*ar*.12;spots.push({x:it.x,w:I.w,y:peekY,z:Math.round(it.y)-1})}});
  const edges=[{x:3,y:82,z:3},{x:97,y:90,z:3},{x:50,y:108,z:3},{x:3,y:99,z:3},{x:97,y:72,z:3},{x:25,y:108,z:3},{x:75,y:108,z:3}];
  const keys=ptKeys().map(c=>c.k).sort(()=>Math.random()-.5);const pool=spots.sort(()=>Math.random()-.5);
  return keys.map((k,i)=>{let h;if(i<pool.length){const q=pool[i];h={x:q.x+(Math.random()-.5)*q.w*.4,y:q.y,z:q.z}}else if(i-pool.length<edges.length)h=edges[i-pool.length];else{const q=pool.length?pool[i%pool.length]:edges[i%edges.length];h={x:q.x+(Math.random()-.5)*8,y:q.y,z:q.z}}
    return {k,x:+h.x.toFixed(1),y:+h.y.toFixed(1),z:h.z}})}
function ptSeekStart(hides,found,by,quiet){const sc=document.getElementById('ptscene');if(!sc)return;PT.seek={hides,found:Object.assign({},found||{}),score:{}};Object.values(PT.seek.found).forEach(q=>PT.seek.score[q]=(PT.seek.score[q]||0)+1);
  sc.classList.add('rmseeking');const place=()=>{Object.entries(hides).forEach(([k,h])=>{const el=sc.querySelector(`[data-ptc="${k}"]`);if(!el||PT.seek.found[k])return;clearTimeout(el._t);el.classList.remove('rmwalk');el.style.transition='none';ptPose(el,'sit');el.style.left=h.x+'%';el.style.top=h.y+'%';el.style.zIndex=h.z;el.classList.add('rmhid')});ptSeekBadge()};
  if(quiet)return place();const p=(PT.people||[]).find(x=>x.pid===by);
  const cover=document.createElement('div');cover.className='rmcover';cover.innerHTML=`<b>🙈 다 같이 눈 감아요!</b><span>${p?esc(p.nick)+' 친구가 숨바꼭질을 시작했어요 · ':''}하나, 둘, 셋…</span>`;sc.appendChild(cover);
  setTimeout(()=>{if(!PT||!PT.seek)return cover.remove();place();cover.innerHTML=`<b>🔍 친구 ${Object.keys(hides).length}마리를 먼저 찾아요!</b><span>먼저 누른 사람이 찾은 걸로 쳐요</span>`;setTimeout(()=>cover.classList.add('rmfade'),1600);setTimeout(()=>cover.remove(),2300)},1600)}
function ptSeekBadge(){const sc=document.getElementById('ptscene');if(!sc||!PT||!PT.seek)return;let b=sc.querySelector('.rmsbadge');if(!b){b=document.createElement('div');b.className='rmsbadge ptsb';sc.appendChild(b)}
  const n=Object.keys(PT.seek.found).length,t=Object.keys(PT.seek.hides).length;const sc2=Object.entries(PT.seek.score).sort((a,b)=>b[1]-a[1]).map(([pid,v])=>{const p=(PT.people||[]).find(x=>x.pid===pid);return `<i style="background:${ptColor(pid)}">${esc(p?(pid===PT.pid?'나':p.nick):'?')} ${v}</i>`}).join('');
  b.innerHTML=`🔍 ${n} / ${t}${sc2?' '+sc2:''}`}
function ptFound(d){if(!PT||!PT.seek)return;PT.seek.found[d.k]=d.by;PT.seek.score[d.by]=(PT.seek.score[d.by]||0)+1;const el=document.querySelector(`#ptscene [data-ptc="${d.k}"]`);const p=(PT.people||[]).find(x=>x.pid===d.by);
  if(el){el.classList.remove('rmhid');el.style.transition='';const y=66+Math.random()*26,x=Math.max(8,Math.min(92,parseFloat(el.style.left)));el.style.left=x+'%';el.style.top=y+'%';el.style.zIndex=Math.round(y)+1;
    const h=document.createElement('i');h.className='rmheart ptfound';h.style.background=ptColor(d.by);h.textContent=(d.by===PT.pid?'내가':esc(p?p.nick:'친구'))+' 찾았다!';el.appendChild(h);setTimeout(()=>h.remove(),1800);
    if(PT.st[d.k])Object.assign(PT.st[d.k],{x,y,z:Math.round(y)+1,pose:'sit',spot:null})}
  ptSeekBadge()}
function ptSeekEnd(score){if(!PT)return;const sc=document.getElementById('ptscene');PT.seek=null;if(sc){sc.classList.remove('rmseeking');const b=sc.querySelector('.rmsbadge');if(b)b.remove()}
  const rank=Object.entries(score||{}).sort((a,b)=>b[1]-a[1]);const nm=pid=>{const p=(PT.people||[]).find(x=>x.pid===pid);return pid===PT.pid?'나':(p?p.nick:'친구')};
  const top=rank.length?rank[0][1]:0;const win=rank.filter(r=>r[1]===top).map(r=>nm(r[0]));const mine=(score||{})[PT.pid]||0;
  const R=rmS();let bonus='';if(R.ptSeekDay!==today()){R.ptSeekDay=today();if(rmEarn(1))bonus='<span>오늘의 숨바꼭질 보너스 ⭐1</span>'}
  if(sc){const cover=document.createElement('div');cover.className='rmcover ptend';cover.innerHTML=`<b>🎉 다 찾았어요!</b><span>🏆 ${win.map(esc).join(', ')} ${win.length>1?'공동 1등':'1등'} (${top}마리)</span><div class="ptrank">${rank.map(([pid,v])=>`<i style="background:${ptColor(pid)}">${esc(nm(pid))} ${v}마리</i>`).join('')}</div><span>나는 ${mine}마리 찾았어요</span>${bonus}`;sc.appendChild(cover);setTimeout(()=>cover.classList.add('rmfade'),3800);setTimeout(()=>cover.remove(),4500)}
  PT.busy=Date.now()+3000}
document.addEventListener('click',e=>{if(!PT||!PT.seek)return;const sc=e.target.closest('#ptscene');if(!sc)return;e.preventDefault();e.stopPropagation();
  let hit=null,best=1e9;sc.querySelectorAll('.rmc.rmhid:not(.ptpend)').forEach(c=>{const r=c.getBoundingClientRect();if(e.clientX>=r.left-6&&e.clientX<=r.right+6&&e.clientY>=r.top-6&&e.clientY<=r.bottom+6){const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height*.3));if(d<best){best=d;hit=c}}});
  if(hit){hit.classList.add('ptpend');ptApi('/api/act',{code:PT.code,pid:PT.pid,tok:PT.tok,t:'found',k:hit.dataset.ptc}).then(j=>{hit.classList.remove('ptpend');if(j&&j.late)toast('아깝다! 친구가 먼저 찾았어요')}).catch(()=>hit.classList.remove('ptpend'))}},true);

document.addEventListener('click',e=>{const t=e.target.closest('[data-ptsrvsave],[data-ptsrvreset]');if(!t)return;e.preventDefault();e.stopPropagation();
  try{if(t.dataset.ptsrvreset!=null){localStorage.removeItem('ptURL')}else{const v=(document.querySelector('[data-ptsrvin]')||{}).value||'';const u=v.trim().replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(u)){toast('https:// 로 시작하는 주소를 넣어 주세요');return}localStorage.setItem('ptURL',u)}}catch(err){}
  toast('주소를 바꿨어요. 다시 열어요');setTimeout(()=>location.reload(),600)},true);
</script>

async function hardRefresh(){try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}if(navigator.serviceWorker){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}}catch(e){}location.replace(location.pathname+"?r="+Date.now())}</script></body></html>
